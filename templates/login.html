```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - HousePrice</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="navbar">

        <div class="nav-brand">
            🏠 HousePrice
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/register">Register</a>
        </div>

    </nav>


    <main class="hero">

        <div class="prediction-card">

            <h2>Welcome Back</h2>

            <p class="card-description">
                Login to your HousePrice account to continue.
            </p>


            <form action="/login" method="POST">

                <div class="form-group">

                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit" class="predict-button">
                    Login →
                </button>

            </form>


            <p class="card-description" style="margin-top: 20px; margin-bottom: 0;">
                Don't have an account?
                <a href="/register"
                   style="color: #2563eb; text-decoration: none; font-weight: 600;">
                    Register here
                </a>
            </p>

        </div>

    </main>

</body>

</html>
```
