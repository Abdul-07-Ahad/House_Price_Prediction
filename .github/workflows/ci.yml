name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall .

      - name: Build Docker image
        run: docker build -t house-price-flask:ci .

      - name: Verify Docker image
        run: docker images house-price-flask

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        run: docker tag house-price-flask:ci abdul07ahad/house-price-prediction:${{ github.sha }}

      - name: Push Docker image
        run: docker push abdul07ahad/house-price-prediction:${{ github.sha }}

      - name: Update Kubernetes image
        run: |
          sed -i "s|image: abdul07ahad/house-price-prediction:.*|image: abdul07ahad/house-price-prediction:${{ github.sha }}|" kubernetes/flask-deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes/flask-deployment.yaml
          git commit -m "Update Kubernetes image to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push
